<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore — Интернет-магазин (Bitrix24)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

<header class="bg-indigo-600 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">TechStore (Bitrix24)</h1>
        <div class="bg-indigo-700 px-4 py-2 rounded-lg font-medium">
            Корзина: <span id="cart-count">0</span> товаров | <span id="cart-total">0</span> ₽
        </div>
    </div>
</header>

<main class="container mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8 flex-grow">

    <div class="md:col-span-2">
        <h2 class="text-2xl font-bold mb-6">Каталог товаров</h2>
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <p class="text-gray-500">Загрузка каталога из Битрикс24...</p>
        </div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-md h-fit border border-gray-100">
        <h2 class="text-xl font-bold mb-4">Ваша корзина</h2>

        <div id="cart-items" class="divide-y divide-gray-100 mb-4 max-h-60 overflow-y-auto">
            <p class="text-gray-400 text-sm py-2">Корзина пуста</p>
        </div>

        <div class="border-t pt-4 mb-4 flex justify-between font-bold text-lg">
            <span>Итого:</span>
            <span id="sidebar-total">0 ₽</span>
        </div>

        <form id="order-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ваше имя</label>
                <input type="text" id="name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Иван">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Телефон или Email</label>
                <input type="text" id="contact" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="+7 999 000-00-00">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed">
                Оформить заказ
            </button>
        </form>

        <div id="order-result" class="mt-4 hidden p-3 rounded-lg text-sm"></div>
    </div>
</main>

<footer class="bg-white border-t py-4 text-center text-sm text-gray-500">
    Тестовое задание
</footer>

<script src="/js/main.js"></script>
</body>
</html>
